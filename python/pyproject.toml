[project]
name = "magika-dir-stats-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.7"
dependencies = [
    "magika==1.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
