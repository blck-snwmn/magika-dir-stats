name: Python CI

on:
  push:
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
      - 'aqua.yaml'


permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install aqua tools
      uses: aquaproj/aqua-installer@82d0e83878a8657c4a6f2ff1755d3bfbfc67f329 # v4.1.0
      with:
        aqua_version: v2.64.0

    - name: Set up Python
      run: uv python install

    - name: Install dependencies
      run: uv sync --locked

    - name: Run import smoke
      run: uv run python -c "from magika import Magika; Magika()"

    - name: Compile Python sources
      run: uv run python -m compileall -q -x '(^|/)\.venv/' .

    - name: Run ruff lint
      run: uv run ruff check .

    - name: Run ruff format check
      run: uv run ruff format --check .
